        circleId:
          type: integer
        userId:
          type: ["integer", "null"]
        displayName:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, admin, member, guest]
        status:
          type: string
          enum: [active, pending, removed]

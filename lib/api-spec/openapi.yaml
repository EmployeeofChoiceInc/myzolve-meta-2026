        initiatorCircleId:
          type: integer
        receiverCircleId:
          type: integer
        permissionScope:
          type: string
          enum: [service_only, referral, support_sharing]
        status:
          type: string
          enum: [pending, approved, declined]
        message:
          type: ["string", "null"]
        token:
          type: string
        respondedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - initiatorCircleId
        - receiverCircleId
        - permissionScope
        - status
        - token
        - createdAt

    CreateConnectionBody:
      type: object
      properties:
        receiverCircleId:
          type: integer
        permissionScope:
          type: string
          enum: [service_only, referral, support_sharing]
          default: service_only
        message:
          type: string
          maxLength: 500
      required:
        - receiverCircleId

    RespondConnectionBody:
      type: object
      properties:
        action:
          type: string
          enum: [approve, decline]
      required:

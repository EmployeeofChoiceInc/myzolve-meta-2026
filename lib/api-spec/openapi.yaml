        circleId:
          type: integer
        totalMembers:
          type: integer
        openRequests:
          type: integer
        completedRequests:
          type: integer
        totalSupportGiven:
          type: number
        totalSupportReceived:
          type: number
        activeServices:
          type: integer
        recentActivityCount:
          type: integer
      required:
        - circleId
        - totalMembers
        - openRequests
        - completedRequests
        - totalSupportGiven
        - totalSupportReceived
        - activeServices
        - recentActivityCount

    # ── Members ───────────────────────────────────────────────────────────────
    CircleMember:
      type: object

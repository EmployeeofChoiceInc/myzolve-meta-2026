        - circleId
        - displayName
        - role
        - status
        - createdAt

    UpdateCircleMemberBody:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member, guest]

    # ── Invitations ────────────────────────────────────────────────────────────
    CircleInvitation:
      type: object

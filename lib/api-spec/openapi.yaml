      in: path
      required: true
      schema:
        type: integer

    memberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer

    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer

    serviceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer

  responses:

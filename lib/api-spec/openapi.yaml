        description:
          type: string
        currency:
          type: string
          default: USD
        privacyMode:
          type: string
          enum: [private, hidden, open, community]
          default: private
        ledgerMode:
          type: string
          enum: [private, summary, full, admin_only]
          default: private
      required:
        - name
        - circleType

    UpdateCircleBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        circleType:
          type: string
          enum: [family, chosen_family, friends, caregiving_circle, neighborhood_circle, other]
        privacyMode:
          type: string
          enum: [private, hidden, open, community]
        ledgerMode:
          type: string
          enum: [private, summary, full, admin_only]
        currency:
          type: string


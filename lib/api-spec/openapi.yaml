        role:
          type: string
          enum: [admin, member, guest]
          default: member
        customMessage:
          type: string

    # ── Support Requests ───────────────────────────────────────────────────────
    SupportRequest:
      type: object
      properties:
        id:
          type: integer
        circleId:
          type: integer
        createdByUserId:
          type: integer
        onBehalfOfPlaceholderId:
          type: ["integer", "null"]
        createdByName:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        amountRequested:
          type: number
        amountFunded:
          type: number
        currency:
          type: string
        requestType:
          type: string
          enum: [money, service, emergency]
        visibilityScope:
          type: string
          enum: [whole_circle, admins_only, private_draft]
        repaymentExpected:
          type: boolean
        repaymentStyle:
          type: string
          enum: [one_time, installments, flexible, no_repayment, gift, discuss_later]
        urgencyLevel:
          type: string
          enum: [low, normal, important, urgent, emergency]
        category:
          type: string
        privacyLevel:
          type: string
          enum: [standard, sensitive, fully_private]
        status:
          type: string
          enum: [draft, open, accepted, partially_funded, fully_funded, declined, canceled, completed, archived]
        isExpired:
          type: boolean
        dueDate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - circleId
        - createdByUserId
        - createdByName
        - title
        - amountRequested
        - amountFunded
        - currency
        - requestType
        - visibilityScope
        - repaymentExpected
        - repaymentStyle
        - urgencyLevel
        - category
        - privacyLevel
        - status
        - createdAt
        - updatedAt

    SupportRequestDetail:
      allOf:
        - $ref: "#/components/schemas/SupportRequest"
        - type: object
          properties:
            contributions:
              type: array
              items:
                $ref: "#/components/schemas/Contribution"
            repaymentPlan:
              oneOf:
                - $ref: "#/components/schemas/RepaymentPlan"
                - type: "null"
          required:
            - contributions

    CreateSupportRequestBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        amountRequested:
          type: number
        currency:
          type: string
          default: USD
        requestType:
          type: string
          enum: [money, service, emergency]
          default: money
        visibilityScope:
          type: string
          enum: [whole_circle, admins_only, private_draft]
          default: whole_circle
        repaymentExpected:
          type: boolean
          default: false
        repaymentStyle:
          type: string
          enum: [one_time, installments, flexible, no_repayment, gift, discuss_later]
          default: discuss_later
        urgencyLevel:
          type: string
          enum: [low, normal, important, urgent, emergency]
          default: normal
        category:
          type: string
          default: other
        privacyLevel:
          type: string
          enum: [standard, sensitive, fully_private]
          default: standard
        dueDate:
          type: string
          format: date-time
        onBehalfOfPlaceholderId:
          type: integer
          description: ID of a placeholder member this request is being made on behalf of (must belong to the same circle)
      required:
        - title
        - amountRequested

    UpdateSupportRequestBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        amountRequested:
          type: number
        urgencyLevel:
          type: string
          enum: [low, normal, important, urgent, emergency]
        category:
          type: string
        status:
          type: string
          enum: [draft, open, accepted, partially_funded, fully_funded, declined, canceled, completed, archived]
        dueDate:
          type: string
          format: date-time
        repaymentExpected:
          type: boolean
        repaymentStyle:
          type: string
          enum: [one_time, installments, flexible, no_repayment, gift, discuss_later]


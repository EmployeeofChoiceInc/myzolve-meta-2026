        circleId:
          type: integer
        invitedEmail:
          type: ["string", "null"]
        invitedByUserId:
          type: integer
        role:
          type: string
          enum: [admin, member, guest]
        customMessage:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, sent, accepted, expired, revoked]
        token:
          type: string
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:

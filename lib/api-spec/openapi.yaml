openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MyZolve Connect API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user operations
  - name: circles
    description: Circle management
  - name: members
    description: Circle membership
  - name: invitations
    description: Circle invitations
  - name: requests
    description: Support requests
  - name: contributions
    description: Contributions to requests
  - name: repayments
    description: Repayment tracking
  - name: services
    description: Service exchange board
  - name: activity
    description: Activity feed
  - name: ledger
    description: Soft ledger
  - name: dashboard
    description: Dashboard summaries
  - name: notifications
    description: In-app notifications and preferences
  - name: comments
    description: Comments and gratitude notes
  - name: reactions
    description: Emoji reactions
  - name: disputes
    description: Dispute management
  - name: audit
    description: Audit log
  - name: attachments
    description: File attachments
  - name: storage
    description: Object storage upload and serving

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Me ──────────────────────────────────────────────────────────────────────
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile
      security: [{ clerk: [] }]
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update current user profile
      security: [{ clerk: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Circles ──────────────────────────────────────────────────────────────────
  /circles:
    get:
      operationId: listCircles
      tags: [circles]
      summary: List circles the current user belongs to
      security: [{ clerk: [] }]
      responses:
        "200":
          description: List of circles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Circle"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCircle
      tags: [circles]
      summary: Create a new circle
      security: [{ clerk: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCircleBody"
      responses:
        "201":
          description: Circle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /circles/{circleId}:
    get:
      operationId: getCircle
      tags: [circles]
      summary: Get a circle by ID
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      responses:
        "200":
          description: Circle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCircle
      tags: [circles]
      summary: Update a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCircleBody"
      responses:
        "200":
          description: Updated circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCircle
      tags: [circles]
      summary: Delete a circle (owner only)
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      responses:
        "204":
          description: Circle deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /circles/{circleId}/stats:
    get:
      operationId: getCircleStats
      tags: [circles, dashboard]
      summary: Get circle overview statistics
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      responses:
        "200":
          description: Circle statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Members ───────────────────────────────────────────────────────────────
  /circles/{circleId}/members:
    get:
      operationId: listCircleMembers
      tags: [members]
      summary: List members of a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircleMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /circles/{circleId}/members/{memberId}:
    patch:
      operationId: updateCircleMember
      tags: [members]
      summary: Update a circle member's role or status
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
        - $ref: "#/components/parameters/memberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCircleMemberBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeCircleMember
      tags: [members]
      summary: Remove a member from a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
        - $ref: "#/components/parameters/memberId"
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Invitations ────────────────────────────────────────────────────────────
  /circles/{circleId}/invitations:
    get:
      operationId: listCircleInvitations
      tags: [invitations]
      summary: List pending invitations for a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      responses:
        "200":
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircleInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCircleInvitation
      tags: [invitations]
      summary: Invite someone to a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationBody"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept a circle invitation by token
      security: [{ clerk: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted, joined circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      security: [{ clerk: [] }]
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Invitation revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Cross-circle Connections ────────────────────────────────────────────────
  /circles/{circleId}/connections:
    get:
      operationId: listCircleConnections
      tags: [connections]
      summary: List connections for a circle (as initiator or receiver)
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircleConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCircleConnection
      tags: [connections]
      summary: Initiate a connection request to another circle (owner/admin only)
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionBody"
      responses:
        "201":
          description: Connection request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A connection between these circles already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /circles/{circleId}/connections/{connectionId}/respond:
    post:
      operationId: respondCircleConnection
      tags: [connections]
      summary: Approve or decline a connection request (receiver owner/admin only)
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
        - name: connectionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondConnectionBody"
      responses:
        "200":
          description: Connection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Connection is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/token/{token}:
    get:
      operationId: getConnectionByToken
      tags: [connections]
      summary: Look up a cross-circle connection invite by its share token
      security: [{ clerk: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /connections/token/{token}/respond:
    post:
      operationId: respondConnectionByToken
      tags: [connections]
      summary: Approve or decline a connection invite by share token (receiver owner/admin)
      security: [{ clerk: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondConnectionBody"
      responses:
        "200":
          description: Connection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Connection is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Transfer Ownership ──────────────────────────────────────────────────────
  /circles/{circleId}/transfer-ownership:
    post:
      operationId: transferCircleOwnership
      tags: [circles]
      summary: Transfer circle ownership to another member (current owner only)
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipBody"
      responses:
        "200":
          description: Ownership transferred; caller's role demoted to admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Support Requests ───────────────────────────────────────────────────────
  /circles/{circleId}/requests:
    get:
      operationId: listSupportRequests
      tags: [requests]
      summary: List support requests in a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
        - name: status
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of support requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSupportRequest
      tags: [requests]
      summary: Create a support request
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportRequestBody"
      responses:
        "201":
          description: Support request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /requests/{requestId}:
    get:
      operationId: getSupportRequest
      tags: [requests]
      summary: Get a support request by ID
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: Support request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSupportRequest
      tags: [requests]
      summary: Update a support request
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupportRequestBody"
      responses:
        "200":
          description: Updated support request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /requests/{requestId}/cancel:
    post:
      operationId: cancelSupportRequest
      tags: [requests]
      summary: Cancel a support request
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: Cancelled request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /requests/{requestId}/complete:
    post:
      operationId: completeSupportRequest
      tags: [requests]
      summary: Mark a support request as completed
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: Completed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /requests/{requestId}/expire:
    post:
      operationId: expireSupportRequest
      tags: [requests]
      summary: Expire an emergency or time-sensitive support request that has passed its due date
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: Expired (archived) request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Request cannot be expired (wrong status or due date not reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Contributions ──────────────────────────────────────────────────────────
  /requests/{requestId}/contributions:
    get:
      operationId: listContributions
      tags: [contributions]
      summary: List contributions for a support request
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: List of contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contribution"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createContribution
      tags: [contributions]
      summary: Contribute to a support request
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionBody"
      responses:
        "201":
          description: Contribution created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /requests/{requestId}/confirm-receipt:
    post:
      operationId: confirmReceipt
      tags: [contributions]
      summary: Confirm receipt of support
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: Receipt confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contributions/{contributionId}/forgive:
    post:
      operationId: forgiveContribution
      tags: [contributions]
      summary: Forgive a loan contribution (convert to gift)
      security: [{ clerk: [] }]
      parameters:
        - name: contributionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contribution forgiven
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Repayment Plans ────────────────────────────────────────────────────────
  /requests/{requestId}/repayment-plan:
    get:
      operationId: getRepaymentPlan
      tags: [repayments]
      summary: Get repayment plan for a request
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: Repayment plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRepaymentPlan
      tags: [repayments]
      summary: Create a repayment plan
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepaymentPlanBody"
      responses:
        "201":
          description: Repayment plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Repayments ────────────────────────────────────────────────────────────
  /repayments:
    post:
      operationId: createRepayment
      tags: [repayments]
      summary: Record a repayment
      security: [{ clerk: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepaymentBody"
      responses:
        "201":
          description: Repayment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repayment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /circles/{circleId}/repayments:
    get:
      operationId: listRepayments
      tags: [repayments]
      summary: List repayments in a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
      responses:
        "200":
          description: List of repayments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repayment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /repayments/{repaymentId}/confirm:
    post:
      operationId: confirmRepayment
      tags: [repayments]
      summary: Confirm a repayment was received
      security: [{ clerk: [] }]
      parameters:
        - name: repaymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Repayment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Service Posts ──────────────────────────────────────────────────────────
  /circles/{circleId}/services:
    get:
      operationId: listServicePosts
      tags: [services]
      summary: List service posts in a circle
      security: [{ clerk: [] }]
      parameters:
        - $ref: "#/components/parameters/circleId"
        - name: serviceType
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of service posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePost"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createServicePost

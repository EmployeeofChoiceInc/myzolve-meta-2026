          type: ["string", "null"]
        nextDueDate:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [active, completed, paused]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - requestId
        - totalAmount
        - frequency
        - status
        - createdAt

    CreateRepaymentPlanBody:
      type: object
      properties:
        totalAmount:

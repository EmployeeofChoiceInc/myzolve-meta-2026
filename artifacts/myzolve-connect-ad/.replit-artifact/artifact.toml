kind = "video"
previewPath = "/myzolve-connect-ad/"
title = "MyZolve Connect Ad"
version = "1.0.0"
id = "artifacts/myzolve-connect-ad"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/myzolve-connect-ad/" ]
localPort = 21875

[services.development]
run = "pnpm --filter @workspace/myzolve-connect-ad run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/myzolve-connect-ad", "run", "build" ]
publicDir = "artifacts/myzolve-connect-ad/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21875"
BASE_PATH = "/myzolve-connect-ad/"
